<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" width="280" height="50">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Film/Edit Icon -->
  <rect x="4" y="5" width="40" height="40" rx="10" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Play triangle -->
  <polygon points="15,15 15,35 33,25" fill="white"/>
  <!-- Edit pencil -->
  <rect x="28" y="26" width="16" height="5" rx="2" fill="white" transform="rotate(-45 36 28.5)"/>
  <!-- Text -->
  <text x="52" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#111827">Edit</text>
  <text x="120" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="300" fill="#6366F1">OS</text>
</svg>
