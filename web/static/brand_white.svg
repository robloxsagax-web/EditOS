<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" width="280" height="50">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366F1" flood-opacity="0.4"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Icon Background with glow -->
  <rect x="4" y="5" width="40" height="40" rx="10" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Film strip frame -->
  <rect x="10" y="11" width="28" height="28" rx="3" fill="white" opacity="0.95"/>
  <!-- Film perforations -->
  <rect x="12" y="9" width="4" height="4" rx="1" fill="white"/>
  <rect x="12" y="37" width="4" height="4" rx="1" fill="white"/>
  <rect x="32" y="9" width="4" height="4" rx="1" fill="white"/>
  <rect x="32" y="37" width="4" height="4" rx="1" fill="white"/>
  <!-- Play button -->
  <polygon points="18,18 18,32 30,25" fill="#6366F1"/>
  <!-- Edit pencil -->
  <rect x="24" y="23" width="14" height="4" rx="2" fill="#8B5CF6" transform="rotate(-45 31 25)"/>
  <!-- Text - DARK for light backgrounds -->
  <text x="52" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#1F2937">Edit</text>
  <text x="120" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#6366F1">OS</text>
</svg>
