<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366F1" flood-opacity="0.4"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Icon Background with glow -->
  <rect x="4" y="6" width="48" height="48" rx="12" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Film strip frame -->
  <rect x="12" y="14" width="32" height="32" rx="4" fill="white" opacity="0.95"/>
  <!-- Film perforations -->
  <rect x="14" y="12" width="5" height="5" rx="1" fill="white"/>
  <rect x="14" y="43" width="5" height="5" rx="1" fill="white"/>
  <rect x="33" y="12" width="5" height="5" rx="1" fill="white"/>
  <rect x="33" y="43" width="5" height="5" rx="1" fill="white"/>
  <!-- Play button -->
  <polygon points="22,22 22,38 36,30" fill="#6366F1"/>
  <!-- Edit pencil -->
  <rect x="28" y="26" width="16" height="5" rx="2" fill="#8B5CF6" transform="rotate(-45 36 28.5)"/>
  <!-- Text with gradient -->
  <text x="62" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#1F2937">Edit</text>
  <text x="145" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#6366F1">OS</text>
</svg>
