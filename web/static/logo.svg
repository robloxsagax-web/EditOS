<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Film/Edit Icon -->
  <rect x="4" y="8" width="44" height="44" rx="10" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Play triangle -->
  <polygon points="17,20 17,40 36,30" fill="white"/>
  <!-- Edit pencil overlay -->
  <rect x="30" y="28" width="20" height="6" rx="2" fill="white" transform="rotate(-45 40 31)"/>
  <!-- Text - White for general use -->
  <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#1F2937">Edit</text>
  <text x="130" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#6366F1">OS</text>
</svg>
